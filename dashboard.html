<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Fiscal de Gas</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

/* Pantalla principal */
#home {
  padding: 20px;
}

h1 {
  text-align: center;
  color: #003366;
}

.station-btn {
  width: 100%;
  padding: 18px;
  margin: 10px 0;
  background: #0055aa;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

.station-btn:hover {
  background: #003f7d;
}

/* Pantalla de detalle */
#detail {
  display: none;
  padding: 20px;
}

.back-btn {
  background: #444;
  color: white;
  padding: 10px 15px;
  border: none;
  border-radius: 6px;
  margin-bottom: 15px;
  cursor: pointer;
}

.data-box {
  background: white;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 10px;
  box-shadow: 0 0 5px rgba(0,0,0,0.1);
}

.data-box strong {
  color: #003366;
}
</style>
</head>

<body>

<!-- Pantalla principal -->
<div id="home">
  <h1>Dashboard Fiscal de Gas</h1>

  <button class="station-btn" onclick="openStation('EF- Muri')">EF- Muri</button>
  <button class="station-btn" onclick="openStation('EF- Musipan')">EF- Musipan</button>
  <button class="station-btn" onclick="openStation('EF- Carito')">EF- Carito</button>
  <button class="station-btn" onclick="openStation('EF- Coa')">EF- Coa</button>
  <button class="station-btn" onclick="openStation('EF- Cot')">EF- Cot</button>
  <button class="station-btn" onclick="openStation('EF- Santa Bárbara')">EF- Santa Bárbara</button>
</div>

<!-- Pantalla de detalle -->
<div id="detail">
  <button class="back-btn" onclick="goHome()">← Volver</button>
  <h2 id="station-title"></h2>
  <div id="station-data"></div>
</div>

<script>
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgoCH-86fJPjGAsqOqZrrtktyUNQXLG3xa2QDZlzOGyjEaXb1UM
