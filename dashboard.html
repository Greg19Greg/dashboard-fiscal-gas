<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Fiscal de Gas</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

/* Pantalla principal */
#home {
  padding: 20px;
}

h1 {
  text-align: center;
  color: #003366;
}

.station-btn {
  width: 100%;
  padding: 18px;
  margin: 10px 0;
  background: #0055aa;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

.station-btn:hover {
  background: #003f7d;
}

/* Pantalla de detalle */
#detail {
  display: none;
  padding: 20px;
}

.back-btn {
  background: #444;
  color: white;
  padding: 10px 15px;
  border: none;
  border-radius: 6px;
  margin-bottom: 15px;
  cursor: pointer;
}

/* Tabs internas */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.tab-btn {
  flex: 1;
  min-width: 120px;
  padding: 10px;
  border: none;
  border-radius: 6px;
  background: #e0e0e0;
  cursor: pointer;
  font-size: 14px;
}

.tab-btn.active {
  background: #0055aa;
  color: #fff;
}

.data-box {
  background: white;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 10px;
  box-shadow: 0 0 5px rgba(0,0,0,0.1);
}

.data-box strong {
  color: #003366;
}
</style>
</head>

<body>

<!-- Pantalla principal -->
<div id="home">
  <h1>Dashboard Fiscal de Gas</h1>

  <button class="station-btn" onclick="openStation('MURI')">MURI</button>
  <button class="station-btn" onclick="openStation('MUSIPAN')">MUSIPAN</button>
  <button class="station-btn" onclick="openStation('CARITO')">CARITO</button>
  <button class="station-btn" onclick="openStation('COA')">COA</button>
  <button class="station-btn" onclick="openStation('COT')">COT</button>
  <button class="station-btn" onclick="openStation('SANTA BARBARA')">SANTA BARBARA</button>
</div>

<!-- Pantalla de detalle -->
<div id="detail">
  <button class="back-btn" onclick="goHome()">← Volver</button>
  <h2 id="station-title"></h2>

  <!-- Tabs internas por estación -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('resumen')">Resumen</button>
    <button class="tab-btn" onclick="showTab('condiciones')">Condiciones de medición</button>
    <button class="tab-btn" onclick="showTab('mantenimiento')">Mantenimiento</button>
    <button class="tab-btn" onclick="showTab('ultrasonido')">Ultrasonido</button>
  </div>

  <!-- Contenedor donde se cargan los datos según la pestaña -->
  <div id="station-data"></div>
</div>

<script>
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgoCH-86fJPjGAsqOqZrrtktyUNQXLG3xa2QDZlzOGyjEaXb1UM6zIQwpFg0dzTw/pub?gid=1009482522&single=true&output=csv";

let allRows = [];
let currentStationRows = []; // filas de la estación seleccionada
let currentTab = "resumen";

/* Normalizador básico */
function normalize(str) {
  return str
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/-/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

/* Cargar CSV */
async function loadCSV() {
  const res = await fetch(CSV_URL);
  const text = await res.text();

  const rows = text.split("\n").map(r => r.split(","));
  const headers = rows[0];

  allRows = rows.slice(1).map(r => {
    let obj = {};
    headers.forEach((h, i) => {
      obj[h.trim()] = r[i] ? r[i].trim() : "";
    });
    return obj;
  });
}

loadCSV();

/* Abrir estación (pantalla 2) */
function openStation(estacion) {
  document.getElementById("home").style.display = "none";
  document.getElementById("detail").style.display = "block";

  document.getElementById("station-title").innerText = estacion;
  currentTab = "resumen";

  // activar primer tab visualmente
  setActiveTabButton("resumen");

  // filtrar filas de esa estación
  currentStationRows = allRows.filter(r =>
    r["Instalación"] &&
    normalize(r["Instalación"]) === normalize(estacion)
  );

  renderCurrentTab();
}

/* Cambiar de pestaña interna */
function showTab(tabName) {
  currentTab = tabName;
  setActiveTabButton(tabName);
  renderCurrentTab();
}

/* Marcar botón activo */
function setActiveTabButton(tabName) {
  const buttons = document.querySelectorAll(".tab-btn");
  buttons.forEach(btn => btn.classList.remove("active"));

  if (tabName === "resumen") buttons[0].classList.add("active");
  if (tabName === "condiciones") buttons[1].classList.add("active");
  if (tabName === "mantenimiento") buttons[2].classList.add("active");
  if (tabName === "ultrasonido") buttons[3].classList.add("active");
}

/* Renderizar contenido según pestaña */
function renderCurrentTab() {
  const container = document.getElementById("station-data");
  let html = "";

  if (!currentStationRows || currentStationRows.length === 0) {
    container.innerHTML = "<p>No se encontraron datos para esta estación.</p>";
    return;
  }

  // Por ahora asumo una fila por estación; si hay más, se listan todas
  currentStationRows.forEach(row => {
    if (currentTab === "resumen") {
      html += `
        <div class="data-box">
          <strong>Instalación:</strong> ${row["Instalación"]}<br>
          <strong>TAG:</strong> ${row["TAG"]}<br>
          <strong>SIZE:</strong> ${row["SIZE"]}<br>
          <strong>PSI:</strong> ${row["PSI"]}<br>
          <strong>Evaluación:</strong> ${row["EVALUACION"]}<br>
        </div>
      `;
    }

    if (currentTab === "condiciones") {
      html += `
        <div class="data-box">
          <strong>Instalación:</strong> ${row["Instalación"]}<br>
          <strong>TAG:</strong> ${row["TAG"]}<br>
          <strong>Bypass:</strong> ${row["BYPASS"]}<br>
          <strong>Toma Muestra:</strong> ${row["TOMA MUESTRA"]}<br>
        </div>
      `;
    }

    if (currentTab === "mantenimiento") {
      html += `
        <div class="data-box">
          <strong>Instalación:</strong> ${row["Instalación"]}<br>
          <strong>Espesor Tubería:</strong> ${row["ESPESOR TUBERIA"]}<br>
          <strong>Espesor Placa:</strong> ${row["ESPESOR PLACA"]}<br>
          <strong>MTTO:</strong> ${row["MTTO"]}<br>
        </div>
      `;
    }

    if (currentTab === "ultrasonido") {
      html += `
        <div class="data-box">
          <strong>Instalación:</strong> ${row["Instalación"]}<br>
          <strong>Ultrasonido:</strong> ${row["ULTRASONIDO"]}<br>
          <strong>Medición Ultrasonido:</strong>
