<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Fiscal de Gas</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

/* Pantalla principal */
#home {
  padding: 20px;
}

h1 {
  text-align: center;
  color: #003366;
}

.station-btn {
  width: 100%;
  padding: 18px;
  margin: 10px 0;
  background: #0055aa;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

.station-btn:hover {
  background: #003f7d;
}

/* Pantalla de detalle */
#detail {
  display: none;
  padding: 20px;
}

.back-btn {
  background: #444;
  color: white;
  padding: 10px 15px;
  border: none;
  border-radius: 6px;
  margin-bottom: 15px;
  cursor: pointer;
}

.data-box {
  background: white;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 10px;
  box-shadow: 0 0 5px rgba(0,0,0,0.1);
}

.data-box strong {
  color: #003366;
}
</style>
</head>

<body>

<!-- Pantalla principal -->
<div id="home">
  <h1>Dashboard Fiscal de Gas</h1>

  <button class="station-btn" onclick="openStation('MURI')">MURI</button>
  <button class="station-btn" onclick="openStation('MUSIPAN')">MUSIPAN</button>
  <button class="station-btn" onclick="openStation('CARITO')">CARITO</button>
  <button class="station-btn" onclick="openStation('COA')">COA</button>
  <button class="station-btn" onclick="openStation('COT')">COT</button>
  <button class="station-btn" onclick="openStation('SANTA BARBARA')">SANTA BARBARA</button>
</div>

<!-- Pantalla de detalle -->
<div id="detail">
  <button class="back-btn" onclick="goHome()">← Volver</button>
  <h2 id="station-title"></h2>
  <div id="station-data"></div>
</div>

<script>
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgoCH-86fJPjGAsqOqZrrtktyUNQXLG3xa2QDZlzOGyjEaXb1UM6zIQwpFg0dzTw/pub?gid=1009482522&single=true&output=csv";

let allRows = [];

/* Normalizador para evitar errores por acentos, espacios o guiones */
function normalize(str) {
  return str
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")   // quita acentos
    .replace(/-/g, "")                 // quita guiones
    .replace(/\s+/g, " ")              // normaliza espacios
    .trim()
    .toLowerCase();
}

/* Cargar CSV */
async function loadCSV() {
  const res = await fetch(CSV_URL);
  const text = await res.text();

  const rows = text.split("\n").map(r => r.split(","));
  const headers = rows[0];

  allRows = rows.slice(1).map(r => {
    let obj = {};
    headers.forEach((h, i) => {
      obj[h.trim()] = r[i] ? r[i].trim() : "";
    });
    return obj;
  });
}

loadCSV();

/* Abrir estación */
function openStation(estacion) {
  document.getElementById("home").style.display = "none";
  document.getElementById("detail").style.display = "block";

  document.getElementById("station-title").innerText = estacion;

  const filtered = allRows.filter(r =>
    r["Instalación"] &&
    normalize(r["Instalación"]) === normalize(estacion)
  );

  let html = "";

  if (filtered.length === 0) {
    html = `<p>No se encontraron datos para esta estación.</p>`;
  } else {
    filtered.forEach(row => {
      html += `
        <div class="data-box">
          <strong>TAG:</strong> ${row["TAG"]}<br>
          <strong>SIZE:</strong> ${row["SIZE"]}<br>
          <strong>PSI:</strong> ${row["PSI"]}<br>
          <strong>Evaluación:</strong> ${row["EVALUACION"]}<br>
          <strong>Bypass:</strong> ${row["BYPASS"]}<br>
          <strong>Toma Muestra:</strong> ${row["TOMA MUESTRA"]}<br>
          <strong>Ultrasonido:</strong> ${row["ULTRASONIDO"]}<br>
          <strong>Espesor Tubería:</strong> ${row["ESPESOR TUBERIA"]}<br>
          <strong>Espesor Placa:</strong> ${row["ESPESOR PLACA"]}<br>
          <strong>MTTO:</strong> ${row["MTTO"]}<br>
          <strong>Medición Ultrasonido:</strong> ${row["MEDICION EFECTIVA ULTRASONIDO"]}<br>
        </div>
      `;
    });
  }

  document.getElementById("station-data").innerHTML = html;
}

/* Volver */
function goHome() {
  document.getElementById("detail").style.display = "none";
  document.getElementById("home").style.display = "block";
}
</script>

</body>
</html>
