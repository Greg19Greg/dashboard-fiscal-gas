<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Fiscal Gas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial; margin: 0; background: #0b1721; color: #f5f5f5; }
    header { background: #c8102e; padding: 12px; text-align: center; font-weight: bold; }
    .container { padding: 12px; }
    .stations-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .station-card { background: #122331; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; border: 1px solid #24394d; }
    .station-card:hover { background: #1b3347; }
    .hidden { display: none; }
    .btn-back { background: #c8102e; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #24394d; padding: 4px 6px; text-align: left; }
    th { background: #182a3a; position: sticky; top: 0; }
    .table-wrapper { max-height: 70vh; overflow-y: auto; margin-top: 8px; }
    .station-title { font-weight: bold; margin-bottom: 6px; }
  </style>
</head>
<body>

<header>Dashboard Fiscal de Gas</header>

<div class="container" id="screen-main">
  <h3>Estaciones</h3>
  <div class="stations-grid">
    <div class="station-card" data-station="EF- Muri">EF- Muri</div>
    <div class="station-card" data-station="EF- Musipan">EF- Musipan</div>
    <div class="station-card" data-station="EF- Carito">EF- Carito</div>
    <div class="station-card" data-station="EF- Coa">EF- Coa</div>
    <div class="station-card" data-station="EF- Cot">EF- Cot</div>
    <div class="station-card" data-station="EF- Santa Bárbara">EF- Santa Bárbara</div>
  </div>
</div>

<div class="container hidden" id="screen-detail">
  <button class="btn-back" id="btnBack">← Volver</button>
  <div class="station-title" id="stationTitle"></div>

  <div class="table-wrapper">
    <table id="detailTable">
      <thead>
        <tr>
          <th>ESTACION</th>
          <th>TAG</th>
          <th>SIZE</th>
          <th>PSI</th>
          <th>EVALUACION</th>
          <th>BYPASS</th>
          <th>TOMA MUESTRA</th>
          <th>ULTRASONIDO</th>
          <th>ESPESOR TUBERIA</th>
          <th>ESPESOR PLACA</th>
          <th>MTTO</th>
          <th>MEDICION EFECTIVA ULTRASONIDO</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/1YC9IcnzQGSEr_0uAOW0ncNpMUsG_Y1jj/edit?gid=1009482522#gid=1009482522";

  let allRows = [];

  async function loadData() {
    const res = await fetch(SHEET_URL);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));

    const cols = json.table.cols.map(c => c.label);
    const rows = json.table.rows.map(r => r.c.map(c => (c ? c.v : "")));

    const idx = {
      estacion: cols.indexOf("Instalación"),
      tag: cols.indexOf("TAG"),
      size: cols.indexOf("SIZE"),
      psi: cols.indexOf("PSI"),
      evaluacion: cols.indexOf("EVALUACION"),
      bypass: cols.indexOf("BYPASS"),
      toma: cols.indexOf("TOMA MUESTRA"),
      ultra: cols.indexOf("ULTRASONIDO"),
      espTub: cols.indexOf("ESPESOR TUBERIA"),
      espPlaca: cols.indexOf("ESPESOR PLACA"),
      mtto: cols.indexOf("MTTO"),
      medUltra: cols.indexOf("MEDICION EFECTIVA ULTRASONIDO")
    };

    allRows = rows
      .filter(r => r[idx.estacion] && r[idx.tag])
      .map(r => ({
        estacion: r[idx.estacion],
        tag: r[idx.tag],
        size: r[idx.size],
        psi: r[idx.psi],
        evaluacion: r[idx.evaluacion],
        bypass: r[idx.bypass],
        toma: r[idx.toma],
        ultra: r[idx.ultra],
        espTub: r[idx.espTub],
        espPlaca: r[idx.espPlaca],
        mtto: r[idx.mtto],
        medUltra: r[idx.medUltra]
      }));
  }

  function showStation(stationName) {
    document.getElementById("screen-main").classList.add("hidden");
    document.getElementById("screen-detail").classList.remove("hidden");
    document.getElementById("stationTitle").textContent = stationName;

    const tbody = document.querySelector("#detailTable tbody");
    tbody.innerHTML = "";

    const filtered = allRows.filter(r => (r.estacion || "").trim() === stationName.trim());

    filtered.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.estacion}</td>
        <td>${r.tag}</td>
        <td>${r.size}</td>
        <td>${r.psi}</td>
        <td>${r.evaluacion}</td>
        <td>${r.bypass}</td>
        <td>${r.toma}</td>
        <td>${r.ultra}</td>
        <td>${r.espTub}</td>
        <td>${r.espPlaca}</td>
        <td>${r.mtto}</td>
        <td>${r.medUltra}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await loadData();

    document.querySelectorAll(".station-card").forEach(card => {
      card.addEventListener("click", () => {
        showStation(card.getAttribute("data-station"));
      });
    });

    document.getElementById("btnBack").addEventListener("click", () => {
      document.getElementById("screen-detail").classList.add("hidden");
      document.getElementById("screen-main").classList.remove("hidden");
    });
  });
</script>

</body>
</html>
